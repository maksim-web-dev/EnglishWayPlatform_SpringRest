server:
  port: ${SERVER_PORT:8089}
  servlet:
    context-path: /api

jwt:
  lifetime: ${JWT_LIFETIME:3d}

token:
  signing:
    key: ${JWT_SIGNING_KEY}

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

logging:
  level:
    org.springdoc: DEBUG

springdoc:
  api-docs:
    path: /open-api/api-docs
  swagger-ui:
    path: /open-api/swagger-ui
    display-request-duration: true

registration:
  activate:
    minute-expiration: ${REGISTRATION_ACTIVATE_EXPIRE_MINUTES:5}
    url: ${REGISTRATION_ACTIVATE_URL:/activate?code=}
  change-password:
    url: ${REGISTRATION_CHANGE_PASSWORD_URL:/change?code=}

frontend:
  url: ${FRONTEND_URL:http://localhost:4200}

email:
  from: ${EMAIL_FROM:support@english-way.com}
  email-dir: ${EMAIL_DIR:/tmp/email}