server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints.web.exposure.include: "health,info,metrics,prometheus"
  endpoint.health.probes.enabled: true

jwt:
  lifetime: ${JWT_LIFETIME:3d}

token:
  signing:
    key: ${JWT_SIGNING_KEY:53A73E5F1C4E0A2D3B5F2D784E6A1B423D6F247D1F6E5C3A596D635A75327855}

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

logging:
  level:
    org.springdoc: DEBUG

springdoc:
  api-docs:
    path: /open-api/api-docs
  swagger-ui:
    path: /open-api/swagger-ui
    display-request-duration: true

registration:
  activate:
    minute-expiration: ${REGISTRATION_ACTIVATE_EXPIRE_MINUTES:5}
    url: ${REGISTRATION_ACTIVATE_URL:/activate?code=}
  change-password:
    url: ${REGISTRATION_CHANGE_PASSWORD_URL:/change?code=}

frontend:
  url: ${FRONTEND_URL:http://localhost:4200}

email:
  from: ${EMAIL_FROM:support@english-way.com}
  email-dir: ${EMAIL_DIR:/tmp/email}

database:
  postgres:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    name: ${DB_NAME:english-way}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}